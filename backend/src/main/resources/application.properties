spring.application.name=industrial-monitoring

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/industrial_monitoring}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:local-development-jwt-secret-for-industrial-monitoring-platform-123456}
